[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nijika-print"
version = "1.0.2"
description = "A compact, local Windows batch-printing desktop app"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.gui-scripts]
nijika-print = "nijika_print.app:main"

[tool.setuptools]
packages = ["nijika_print"]
include-package-data = true

[tool.setuptools.package-data]
nijika_print = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}


[tool.setuptools.data-files]
"share/nijika-print" = ["icon.ico"]

